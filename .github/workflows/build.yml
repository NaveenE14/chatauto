name: Build SnapStep APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip SnapStep-Phone-Cloud-Build.zip -d proj
      - run: echo "kotlin.jvm.target.validation.mode=warning" >> proj/gradle.properties
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug
        working-directory: proj
      - uses: actions/upload-artifact@v4
        with:
          name: SnapStep-debug-apk
          path: proj/app/build/outputs/apk/debug/app-debug.apk
